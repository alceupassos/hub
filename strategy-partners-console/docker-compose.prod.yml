services:
  console:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: strategy-console
    restart: unless-stopped
    ports:
      - "127.0.0.1:3212:3000"
    environment:
      - NODE_ENV=production
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_MODEL_CHAT=${DEEPSEEK_MODEL_CHAT:-deepseek-chat}
      - DEEPSEEK_MODEL_REASONER=${DEEPSEEK_MODEL_REASONER:-deepseek-reasoner}
      # Banco de dados + RAG (Fase 2). Mesma VPS Postgres do semantix, schema isolado
      # strategy_partners — nunca o schema do semantix. Sem novo container Postgres.
      - DATABASE_URL=${DATABASE_URL}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_EMBEDDING_MODEL=${GEMINI_EMBEDDING_MODEL:-text-embedding-004}
      # Camada Anthropic / Eixo B (Fase 3) — desligada por padrão.
      - USE_ANTHROPIC_TIERS=${USE_ANTHROPIC_TIERS:-false}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_OPUS_MODEL=${ANTHROPIC_OPUS_MODEL:-claude-opus-4-8}
      - ANTHROPIC_FABLE_MODEL=${ANTHROPIC_FABLE_MODEL:-claude-fable-5}
      - ANTHROPIC_SONNET_MODEL=${ANTHROPIC_SONNET_MODEL:-claude-sonnet-5}
      # Auth / RBAC (Fase 5) — corte suave: NextAuth + código diário convivem via flag.
      - LEGACY_DAILY_CODE_AUTH=${LEGACY_DAILY_CODE_AUTH:-true}
      - AUTH_SECRET=${AUTH_SECRET}
      - ADMIN_BOOTSTRAP_TOKEN=${ADMIN_BOOTSTRAP_TOKEN}
    networks:
      - angrahub_default
    healthcheck:
      test:
        - "CMD-SHELL"
        - >
          node -e "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 20s
      timeout: 8s
      retries: 5
      start_period: 20s

networks:
  angrahub_default:
    external: true
