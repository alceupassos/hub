services:
  console:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: strategy-console
    restart: unless-stopped
    ports:
      - "127.0.0.1:3212:3000"
    environment:
      - NODE_ENV=production
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_MODEL_CHAT=${DEEPSEEK_MODEL_CHAT:-deepseek-chat}
      - DEEPSEEK_MODEL_REASONER=${DEEPSEEK_MODEL_REASONER:-deepseek-reasoner}
    networks:
      - angrahub_default
    healthcheck:
      test:
        - "CMD-SHELL"
        - >
          node -e "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 20s
      timeout: 8s
      retries: 5
      start_period: 20s

networks:
  angrahub_default:
    external: true
